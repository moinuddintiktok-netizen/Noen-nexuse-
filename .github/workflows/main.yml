name: Neon Nexus Arcade Build

on:
workflow_dispatch:

permissions:
contents: read

jobs:
build-windows:
name: Build Neon Nexus EXE
runs-on: windows-latest

steps:
  - name: Checkout Repository
    uses: actions/checkout@v4

  - name: Setup Python
    uses: actions/setup-python@v5
    with:
      python-version: "3.12"

  - name: Install Dependencies
    run: |
      python -m pip install --upgrade pip
      python -m pip install pygame pyinstaller

  - name: Check Python Syntax
    run: python -m py_compile neon_nexus_arcade.py

  - name: Build Windows EXE
    run: >
      pyinstaller --noconfirm --clean --onefile --windowed
      --name NeonNexusArcade neon_nexus_arcade.py

  - name: Verify EXE
    shell: pwsh
    run: |
      if (!(Test-Path "dist/NeonNexusArcade.exe")) {
        throw "EXE build failed."
      }
      Write-Host "EXE build successful."

  - name: Upload Game Artifact
    uses: actions/upload-artifact@v4
    with:
      name: Neon-Nexus-Arcade-Windows
      path: dist/NeonNexusArcade.exe
      if-no-files-found: error
      retention-days: 14
