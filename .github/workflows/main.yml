name: Neon Nexus Arcade Build

on: push

jobs:
build:
runs-on: windows-latest
steps:
- uses: actions/checkout@v4

  - uses: actions/setup-python@v5
    with:
      python-version: "3.12"

  - name: Install dependencies
    run: python -m pip install pygame pyinstaller

  - name: Check Python syntax
    run: python -m py_compile neon_nexus_arcade.py

  - name: Build Windows EXE
    run: pyinstaller --noconfirm --clean --onefile --windowed --name NeonNexusArcade neon_nexus_arcade.py

  - name: Upload EXE
    uses: actions/upload-artifact@v4
    with:
      name: Neon-Nexus-Arcade-Windows
      path: dist/NeonNexusArcade.exe
