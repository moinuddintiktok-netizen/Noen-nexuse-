name: Neon Nexus Arcade

"on":
workflow_dispatch:

jobs:
build:
runs-on: windows-latest

steps:
  - name: Checkout code
    uses: actions/checkout@v4

  - name: Install Python
    uses: actions/setup-python@v5
    with:
      python-version: "3.12"

  - name: Install dependencies
    run: python -m pip install pygame pyinstaller

  - name: Check Python code
    run: python -m py_compile neon_nexus_arcade.py

  - name: Build EXE
    run: pyinstaller --noconfirm --clean --onefile --windowed --name NeonNexusArcade neon_nexus_arcade.py

  - name: Upload EXE
    uses: actions/upload-artifact@v4
    with:
      name: Neon-Nexus-Arcade-Windows
      path: dist/NeonNexusArcade.exe
