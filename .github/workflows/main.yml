name: Build Neon Nexus Arcade

on:
workflow_dispatch:
push:
branches:
- main
- master
paths:
- "neon_nexus_arcade.py"
- ".github/workflows/build.yml"

permissions:
contents: read

jobs:
build-windows:
name: Build Windows EXE
runs-on: windows-latest

steps:
  - name: Checkout Repository
    uses: actions/checkout@v4

  - name: Setup Python
    uses: actions/setup-python@v5
    with:
      python-version: "3.12"
      cache: pip

  - name: Upgrade pip
    run: python -m pip install --upgrade pip

  - name: Install Game Dependencies
    run: |
      python -m pip install pygame pyinstaller

  - name: Verify Python File
    run: python -m py_compile neon_nexus_arcade.py

  - name: Test Pygame Installation
    run: python -c "import pygame; print('Pygame version:', pygame.version.ver)"

  - name: Build Standalone EXE
    run: |
      pyinstaller `
        --noconfirm `
        --clean `
        --onefile `
        --windowed `
        --name NeonNexusArcade `
        neon_nexus_arcade.py

  - name: Verify EXE
    run: |
      if (!(Test-Path "dist/NeonNexusArcade.exe")) {
        throw "Build failed: EXE file not found."
      }
      Get-Item "dist/NeonNexusArcade.exe"

  - name: Upload Windows Game
    uses: actions/upload-artifact@v4
    with:
      name: Neon-Nexus-Arcade-Windows
      path: dist/NeonNexusArcade.exe
      if-no-files-found: error
      retention-days: 14
