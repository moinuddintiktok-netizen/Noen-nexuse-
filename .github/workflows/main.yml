name: Build EXE

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pygame pyinstaller

      - name: Build EXE
        run: pyinstaller --onefile --windowed --name NeonNexusArcade neon_nexus_arcade.py

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: NeonNexusArcade-exe
          path: dist/NeonNexusArcade.exe
